version: "3.8"
services:
  web:
    image: sharecontest:latest
    env_file: .env.production
    networks: [general_network, traefik_public]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_public
        - traefik.http.routers.sharecontest.entrypoints=websecure
        - traefik.http.routers.sharecontest.rule=Host(`${APP_HOST:-sharecontest.kuruk.in}`)
        - traefik.http.routers.sharecontest.tls=true
        - traefik.http.routers.sharecontest.tls.certresolver=le
        - traefik.http.services.sharecontest.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/health\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: sharecontest:latest
    env_file: .env.production
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=60"]
    networks: [general_network]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
networks:
  general_network:
    external: true
  traefik_public:
    external: true
